<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Player Plugin</title>
    <link rel="stylesheet" href="mediaPlayer.css" />
  </head>
  <body>
    <div class="upload-container">
      <div id="dropzone" class="dropzone" aria-label="Upload video">
        <div class="dz-inner">
          <button type="button" class="dz-icon" aria-label="Choose file">
            ⭳
          </button>
          <p class="dz-text">
            Drag & Drop or
            <button id="chooseBtn" type="button" class="link-btn">
              Choose file
            </button>
            to upload
          </p>
          <small class="dz-hint">Video only (MP4, WebM, MOV…)</small>
        </div>
        <input type="file" id="videoInput" accept="video/*" hidden />
      </div>
    </div>

    <div class="frame-wrap">
      <iframe
        id="playerFrame"
        title="Video Frame"
        class="player-iframe"
      ></iframe>
    </div>

    <template id="playerDoc">
      <html>
        <head>
          <meta charset="utf-8" />
          <link rel="stylesheet" href="mediaPlayer.css" />
        </head>
        <body>
          <div id="playerContainer" class="media-player"></div>
          <script src="mediaPlayer.js"></script>
          <script src="frameApp.js"></script>
        </body>
      </html>
    </template>
    <script src="mediaPlayer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
